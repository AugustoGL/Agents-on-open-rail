<style>
  * { box-sizing: border-box; margin: 0; }

<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="subs"><div class="en"></div><div class="es"></div></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const DARK = { bg: '#141411', surface: '#1E1D19', ink: '#F2EFE6', muted: '#ABA79B', line: '#36342D', dot: '#2a2923', green: '#5FB790', soft: '#1B2E26', amber: '#F5CB6B', amberSoft: '#3A2E10', bad: '#FFA79D', badSoft: '#3A1B17', info: '#9CC4F5', infoSoft: '#192636' };
const LIGHT = { bg: '#F6F3EC', surface: '#FFFFFF', ink: '#1C1B18', muted: '#5C594F', line: '#E2DDD0', dot: '#E7E2D4', green: '#1F6F54', soft: '#E4F1EA', amber: '#B7791F', amberSoft: '#FFF0C9', bad: '#B3261E', badSoft: '#FDE8E5', info: '#1E4A7A', infoSoft: '#E4EEFA' };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const fade = (t, a, d = 0.25) => eo(P(t, a, a + d));
const pop = (t, a, d = 0.4) => Math.max(0.001, back(P(t, a, a + d)));

const svg = document.getElementById('s');
let CUR = svg;
const el = (tag, attrs = {}, parent = CUR) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.appendChild(e); return e; };
const set = (e, attrs) => { for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const txt = (p, s, x, y, size, fill, weight = 800, anchor = 'middle', extra = {}) => { const e = el('text', { x, y, 'text-anchor': anchor, fill, 'font-size': size, 'font-weight': weight, ...extra }, p); e.textContent = s; return e; };
const mono = (p, s, x, y, size, fill, anchor = 'middle', extra = {}) => txt(p, s, x, y, size, fill, 500, anchor, { 'font-family': 'ui-monospace, monospace', 'letter-spacing': 2, ...extra });
const circ = (p, cx, cy, r, attrs = {}) => el('circle', { cx, cy, r, ...attrs }, p);
const rect = (p, x, y, w, h, rx, attrs = {}) => el('rect', { x, y, width: w, height: h, rx, ...attrs }, p);
const place = (e, x, y, s = 1, o = 1, rot = 0) => set(e, { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})`, opacity: o });

const defs = el('defs', {}, svg);
for (const [id, c] of [['dotsD', DARK.dot], ['dotsL', LIGHT.dot]]) {
  const pat = el('pattern', { id, width: 60, height: 60, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 30, cy: 30, r: 1.6, fill: c }, pat);
}
const bg = (C) => { rect(CUR, 0, 0, 1080, 1920, 0, { fill: C.bg }); rect(CUR, 0, 0, 1080, 1920, 0, { fill: C === DARK ? 'url(#dotsD)' : 'url(#dotsL)' }); };

/** Frase clave grande (solo inglés): list = [desde, hasta, línea 1, línea 2, color de la línea 2]. */
function makeKey(p, C, list) {
  const g = el('g', {}, p);
  const k1 = txt(g, '', 540, 1195, 78, C.ink, 800, 'middle', { 'letter-spacing': -1 });
  const k2 = txt(g, '', 540, 1285, 78, C.ink, 800, 'middle', { 'letter-spacing': -1 });
  const fit = (s) => Math.min(78, Math.floor(900 / (Math.max(s.length, 1) * 0.68)));
  return (t) => {
    const a = list.find(([x, y]) => t >= x && t <= y + 0.2);
    if (!a) { set(g, { opacity: 0 }); return; }
    const [x, y, l1, l2, col] = a;
    const o = fade(t, x, 0.18) * (1 - fade(t, y, 0.2));
    k1.textContent = l1; k2.textContent = l2 || '';
    set(k1, { 'font-size': fit(l1), fill: l2 ? C.ink : (col || C.ink) });
    set(k2, { 'font-size': fit(l2 || ''), fill: col || C.ink });
    set(g, { opacity: o, transform: `translate(0 ${lerp(24, 0, fade(t, x, 0.25))})` });
  };
}
const SUBS = []; // [desde, hasta, inglés, español, claro?] en tiempo global
const personIcon = (p, C, x, y, r, color, label) => { const g = el('g', {}, p); circ(g, 0, -r * 0.25, r * 0.38, { fill: color }); el('path', { d: `M ${-r * 0.7} ${r * 0.7} Q 0 ${-r * 0.1} ${r * 0.7} ${r * 0.7} Z`, fill: color }, g); circ(g, 0, 0, r, { fill: 'none', stroke: color, 'stroke-width': 6 }); if (label) mono(g, label, 0, r + 38, 24, C.muted); place(g, x, y); return g; };
const checkMark = (p, color, r = 36) => { const g = el('g', {}, p); circ(g, 0, 0, r, { fill: color }); el('path', { d: `M ${-r * 0.42} 0 l ${r * 0.28} ${r * 0.3} l ${r * 0.56} ${-r * 0.6}`, fill: 'none', stroke: '#fff', 'stroke-width': r * 0.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g); return g; };
const coin = (p, C, color, r = 60, label = '$') => { const g = el('g', {}, p); circ(g, 0, 0, r, { fill: C.soft === undefined ? 'none' : C.surface, stroke: color, 'stroke-width': r * 0.14 }); txt(g, label, 0, r * 0.36, r * 1.05, color, 800); return g; };

// ESCENA 1 · gancho (oscuro)
function scene1(g, C, S) {
  CUR = g; bg(C);
  mono(g, 'SEÑA', 540, 150, 28, C.muted);
  const L = 2 * Math.PI * 210;
  const ring = circ(g, 540, 560, 210, { fill: 'none', stroke: C.green, 'stroke-width': 10, 'stroke-linecap': 'round' });
  const fill = circ(g, 540, 560, 0, { fill: C.soft });
  const dollar = txt(g, '$', 540, 640, 220, C.green, 800);
  const sq = el('path', { d: '', fill: 'none', stroke: C.green, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const doc = el('g', {}, g);
  rect(doc, -350, -190, 700, 380, 28, { fill: C.surface, stroke: C.line, 'stroke-width': 3 });
  mono(doc, 'REFUND RULE', 0, -125, 26, C.muted);
  const lines = ['more than 24 h  →  100 %', '24 h to 6 h     →   50 %', 'under 6 h       →    0 %'].map((s, i) => mono(doc, s, 0, -45 + i * 78, 36, [C.green, C.amber, C.bad][i]));
  const face = el('g', {}, g);
  circ(face, 0, 0, 150, { fill: C.surface, stroke: C.amber, 'stroke-width': 10 }); circ(face, -55, -35, 16, { fill: C.amber }); circ(face, 55, -35, 16, { fill: C.amber });
  el('path', { d: 'M -70 40 Q 0 110 70 40', fill: 'none', stroke: C.amber, 'stroke-width': 10, 'stroke-linecap': 'round' }, face);
  const cross = el('g', {}, g);
  el('line', { x1: -200, y1: -200, x2: 200, y2: 200, stroke: C.bad, 'stroke-width': 20, 'stroke-linecap': 'round' }, cross); el('line', { x1: 200, y1: -200, x2: -200, y2: 200, stroke: C.bad, 'stroke-width': 20, 'stroke-linecap': 'round' }, cross);
  const sena = txt(g, 'SEÑA', 540, 700, 230, C.green, 800);
  const ring2 = circ(g, 540, 640, 200, { fill: 'none', stroke: C.green, 'stroke-width': 10, 'stroke-linecap': 'round' });
  const dollar2 = txt(g, '$', 540, 715, 210, C.green, 800);
  const key = makeKey(g, C, [
    [0.05, 2.0, 'THIS AGENT HANDLES', 'REAL MONEY', C.green], [2.31, 4.56, 'IT DOESN\'T', 'IMPROVISE', C.ink], [5.10, 8.85, 'DECIDED BY', 'A WRITTEN RULE', C.green],
    [8.92, 10.2, 'NOT BY', 'A MOOD', C.bad], [10.66, 11.3, 'ITS NAME IS', 'SEÑA', C.green], [11.36, 15.0, 'FIXING SOMETHING', 'BORING & EXPENSIVE', C.amber], [15.45, 16.5, 'THE', 'DEPOSIT', C.green],
  ]);
  SUBS.push(...[
    [0.0, 2.0, 'This agent handles <b>real money</b>,', 'Este agente maneja plata de verdad,'],
    [2.31, 4.56, 'and it doesn\'t improvise a single cent.', 'y no improvisa ni un centavo.'],
    [5.10, 10.17, 'How much it refunds you when you cancel is decided by a <b>written rule</b>, not by a mood.', 'Cuánto te devuelve al cancelar lo decide una regla escrita, no un humor.'],
    [10.66, 11.22, 'It\'s called Seña.', 'Se llama Seña.'],
    [11.36, 15.0, 'And it fixes something boring and expensive:', 'Y arregla algo aburrido y caro:'],
    [15.45, 16.35, 'the <b>deposit</b>.', 'la seña.'],
  ].map(([a, b, en, es]) => [S + 0.15 + a, S + 0.15 + b, en, es, false]));
  return (t) => {
    const d = eo(P(t, 0.1, 1.5)); const out1 = 1 - fade(t, 4.9, 0.3);
    set(ring, { 'stroke-dasharray': L, 'stroke-dashoffset': L * (1 - d), opacity: out1 });
    set(fill, { r: 208 * eo(P(t, 0.9, 1.6)), opacity: out1 });
    place(dollar, 0, 0, 1, fade(t, 1.2, 0.3) * out1); set(dollar, { transform: `translate(0 ${lerp(10, 0, fade(t, 1.2, 0.3))})` });
    // garabato que se endereza
    let path = ''; const A = 60 * (1 - eo(P(t, 3.1, 4.2)));
    for (let x = 140; x <= 940; x += 20) path += `${x === 140 ? 'M' : 'L'} ${x} ${930 + A * Math.sin(x * 0.03 + t * 7)} `;
    set(sq, { d: path, opacity: fade(t, 2.31, 0.3) * out1 });
    // documento con la regla
    const dIn = pop(t, 5.1, 0.45); const dOut = fade(t, 8.85, 0.25);
    place(doc, lerp(540, 240, dOut), 640, dIn, fade(t, 5.1, 0.2) * (1 - dOut));
    lines.forEach((l, i) => set(l, { opacity: fade(t, 5.4 + i * 0.9, 0.3) }));
    const fIn = pop(t, 8.92, 0.45); const fOut = fade(t, 10.25, 0.25);
    place(face, 540, 640, fIn, fade(t, 8.92, 0.2) * (1 - fOut), Math.sin(t * 9) * 6 * (1 - P(t, 9.3, 9.5)));
    place(cross, 540, 640, pop(t, 9.35, 0.3), fade(t, 9.35, 0.1) * (1 - fOut));
    place(sena, 0, 0, 1, 0); set(sena, { transform: `translate(540 ${lerp(720, 640, pop(t, 10.66, 0.5))}) scale(${pop(t, 10.66, 0.5)}) translate(-540 -700)`, opacity: fade(t, 10.66, 0.2) * (1 - fade(t, 15.3, 0.2)) });
    const r2 = eo(P(t, 15.4, 16.3)); set(ring2, { 'stroke-dasharray': 2 * Math.PI * 200, 'stroke-dashoffset': 2 * Math.PI * 200 * (1 - r2) });
    set(dollar2, { opacity: fade(t, 15.8, 0.3) });
    key(t);
  };
}

// ESCENA 2 · el problema (claro)
function scene2(g, C, S) {
  CUR = g; bg(C);
  mono(g, 'THE PROBLEM', 540, 150, 28, C.muted);
  const cust = personIcon(g, C, 250, 640, 95, C.info, 'customer');
  const ven = personIcon(g, C, 830, 640, 95, C.green, 'venue');
  const paper = el('g', {}, g); rect(paper, -100, -130, 200, 260, 18, { fill: C.surface, stroke: C.line, 'stroke-width': 4 });
  [-60, -20, 20].forEach((y) => rect(paper, -60, y, 120, 10, 5, { fill: C.line }));
  mono(paper, 'DEPOSIT', 0, 90, 22, C.muted);
  const zig = el('path', { d: '', fill: 'none', stroke: C.bad, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const slot = el('g', {}, g); rect(slot, -120, -75, 240, 150, 22, { fill: C.soft, stroke: C.green, 'stroke-width': 5 }); mono(slot, 'COURT 1', 0, -10, 30, C.green); mono(slot, '20:00', 0, 34, 28, C.muted);
  const slotX = el('g', {}, g); el('line', { x1: -60, y1: -50, x2: 60, y2: 50, stroke: C.bad, 'stroke-width': 14, 'stroke-linecap': 'round' }, slotX); el('line', { x1: 60, y1: -50, x2: -60, y2: 50, stroke: C.bad, 'stroke-width': 14, 'stroke-linecap': 'round' }, slotX);
  const cn = coin(g, C, C.amber, 52);
  const chips = [['100 %?', C.green, C.soft], ['50 %?', C.amber, C.amberSoft], ['0 %?', C.bad, C.badSoft]].map(([s, col, fillc], i) => {
    const c = el('g', {}, g); rect(c, -120, -55, 240, 110, 28, { fill: fillc, stroke: col, 'stroke-width': 5 }); txt(c, s, 0, 24, 62, col, 800); return c;
  });
  const stamp = el('g', {}, g); rect(stamp, -230, -80, 460, 160, 14, { fill: 'none', stroke: C.bad, 'stroke-width': 10 }); rect(stamp, -215, -65, 430, 130, 8, { fill: 'none', stroke: C.bad, 'stroke-width': 3 }); txt(stamp, 'NO RULE', 0, 36, 100, C.bad, 800);
  const key = makeKey(g, C, [
    [0.05, 2.47, 'A DEPOSIT IS', 'PAPERWORK?', C.muted], [2.88, 5.1, 'IT\'S A FIGHT', 'WAITING TO HAPPEN', C.bad], [5.63, 7.53, 'BOOK A COURT', 'PAY PART OF IT', C.green],
    [7.87, 10.79, 'NOBODY REMEMBERS', 'WHAT WAS AGREED', C.amber], [11.13, 13.21, 'ALL, HALF', 'OR NOTHING', C.bad], [13.71, 15.26, 'THE VENUE LOSES', 'THE SLOT', C.bad], [15.56, 17.1, 'THE CUSTOMER LOSES', 'THE MONEY', C.bad], [17.49, 19.3, 'AND THE ARGUMENT', 'IS FREE', C.bad],
  ]);
  SUBS.push(...[
    [0.0, 2.47, 'Most people think a deposit is paperwork.', 'Casi todos creen que una seña es un trámite.'],
    [2.88, 5.1, 'It\'s actually a <b>fight</b> waiting to happen.', 'En realidad es una pelea esperando a pasar.'],
    [5.63, 7.53, 'You book a court, you pay part of it,', 'Reservás una cancha, pagás una parte,'],
    [7.87, 10.79, 'and when you cancel, nobody remembers what was agreed:', 'y al cancelar nadie recuerda qué se acordó:'],
    [11.13, 13.21, 'the full amount, half, or nothing.', 'todo, la mitad o nada.'],
    [13.71, 15.26, 'The venue loses the slot.', 'El local pierde el turno.'],
    [15.56, 17.1, 'The customer loses the money.', 'El cliente pierde la plata.'],
    [17.49, 19.15, 'And the argument is free.', 'Y la discusión sale gratis.'],
  ].map(([a, b, en, es]) => [S + 0.15 + a, S + 0.15 + b, en, es, true]));
  return (t) => {
    place(cust, 250, 520, 1, 1, 0); place(ven, 830, 520, 1, 1, 0);
    // papel: 0–2.5, se rompe en pelea
    const pIn = fade(t, 0.1, 0.3) * (1 - fade(t, 2.6, 0.25));
    place(paper, 540, 500, pop(t, 0.1, 0.4), pIn, Math.sin(t * 2) * 2);
    // zigzag de pelea
    let d = ''; const amp = 55 * fade(t, 2.88, 0.3) * (1 - fade(t, 5.4, 0.3));
    for (let x = 350; x <= 730; x += 20) d += `${x === 350 ? 'M' : 'L'} ${x} ${520 + amp * Math.sin(x * 0.06 + t * 14)} `;
    set(zig, { d, opacity: fade(t, 2.88, 0.3) * (1 - fade(t, 5.4, 0.3)) });
    // cancha del local y moneda
    const sO = fade(t, 5.7, 0.3) * (1 - fade(t, 13.9, 0.4));
    place(slot, 830, 790, pop(t, 5.7, 0.4), sO);
    place(slotX, 830, 790, pop(t, 13.9, 0.3), fade(t, 13.9, 0.1) * (1 - fade(t, 14.8, 0.4)));
    const move = eio(P(t, 6.4, 7.3)); const away = eio(P(t, 15.7, 16.8));
    place(cn, lerp(250, 660, move) - away * 400, lerp(400, 790, move) - away * 100, 1, fade(t, 5.7, 0.3) * (1 - away));
    // chips ?
    [9.01, 9.6, 10.2].forEach((a, i) => {
      const s = pop(t, a, 0.4); const o = fade(t, a, 0.15) * (1 - fade(t, 13.3, 0.3));
      const hl = i === 0 ? P(t, 11.13, 11.5) * (1 - P(t, 11.9, 12.1)) : i === 1 ? P(t, 11.9, 12.2) * (1 - P(t, 12.5, 12.7)) : P(t, 12.64, 12.9);
      place(chips[i], 270 + i * 270, 960 + Math.sin(t * 3 + i) * 8, s * (1 + 0.12 * hl), o);
    });
    // sello
    const sP = P(t, 17.55, 17.85);
    place(stamp, 540, 960, lerp(2.4, 1, eo(sP)), eo(sP), -8);
    key(t);
  };
}

// ESCENA 3 · qué es (oscuro)
function scene3(g, C, S) {
  CUR = g; bg(C);
  mono(g, 'WHAT IT IS', 540, 150, 28, C.muted);
  const bub = el('g', {}, g); rect(bub, -230, -130, 460, 240, 56, { fill: C.surface, stroke: C.muted, 'stroke-width': 8 }); el('path', { d: 'M -120 108 l -50 70 l 120 -50 z', fill: C.surface, stroke: C.muted, 'stroke-width': 8, 'stroke-linejoin': 'round' }, bub);
  [-90, 0, 90].forEach((x) => circ(bub, x, -10, 18, { fill: C.muted }));

  const celo = el('g', {}, g); rect(celo, -150, -45, 300, 90, 45, { fill: C.amberSoft, stroke: C.amber, 'stroke-width': 5 }); mono(celo, 'CELO NETWORK', 0, 11, 30, C.amber);
  const nodes = ['BOOK', 'PAY', 'CANCEL', 'DECIDE'].map((s, i) => { const n = el('g', {}, g); circ(n, 0, 0, 62, { fill: C.surface, stroke: C.line, 'stroke-width': 8 }); txt(n, String(i + 1), 0, 22, 62, C.muted, 800); mono(n, s, 0, 112, 30, C.muted); return n; });
  const nl = el('line', { x1: 180, y1: 640, x2: 180, y2: 640, stroke: C.green, 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  const key = makeKey(g, C, [
    [0.05, 1.7, 'NOT A', 'CHATBOT', C.bad], [2.08, 3.8, 'AN AGENT', 'WITH ONE JOB', C.green], [4.19, 6.28, 'THE SAME RULE', 'FOR EVERYONE', C.green], [6.77, 9.57, 'DEPOSIT', 'IN wARS', C.green], [9.82, 13.07, 'DIGITAL ARGENTINE PESO', 'ON THE CELO NETWORK', C.amber],
    [13.59, 14.5, 'FOUR', 'STEPS', C.ink], [14.7, 15.3, 'BOOK', '', C.green], [15.5, 16.1, 'PAY', '', C.green], [16.3, 17.7, 'CANCEL', 'OR DON\'T', C.amber], [17.98, 19.6, 'THE AGENT', 'DECIDES', C.green],
  ]);
  SUBS.push(...[
    [0.0, 1.7, 'Seña isn\'t a chatbot.', 'Seña no es un chatbot.'], [2.08, 3.8, 'It\'s an agent with one job:', 'Es un agente con un solo trabajo:'], [4.19, 6.28, 'apply the <b>same rule</b> to everyone.', 'aplicar la misma regla a todos.'],
    [6.77, 9.57, 'It charges the deposit in wARS,', 'Cobra la seña en wARS,'], [9.82, 13.07, 'a digital Argentine peso that runs on the Celo network.', 'un peso argentino digital que corre en la red Celo.'],
    [13.59, 14.36, 'Four steps.', 'Cuatro pasos.'], [14.76, 15.16, '<b>Book.</b>', 'Reservar.'], [15.56, 15.93, '<b>Pay.</b>', 'Pagar.'], [16.32, 17.51, 'Cancel, or don\'t.', 'Cancelar, o no.'], [17.98, 19.57, 'And the <b>agent decides</b>.', 'Y el agente decide.'],
  ].map(([a, b, en, es]) => [S + 0.15 + a, S + 0.15 + b, en, es, false]));
