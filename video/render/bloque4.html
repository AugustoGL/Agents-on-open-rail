<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seña video · block 4 · the rule</title>
<style>
  :root {
    --bg: #141411; --surface: #1E1D19; --surface-2: #26251F; --ink: #F2EFE6; --muted: #ABA79B; --line: #36342D;
    --primary: #5FB790; --primary-soft: #1B2E26; --amber: #F5CB6B; --bad: #FFA79D; --info: #9CC4F5;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: var(--font); }
  svg { position: absolute; inset: 0; }
  text { font-family: var(--font); }
  .mono { font-family: var(--mono); }
  #subs { position: absolute; left: 100px; width: 880px; top: 1360px; text-align: center; }
  #subs .en { font-size: 44px; line-height: 1.18; font-weight: 700; color: var(--ink); text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  #subs .es { margin-top: 10px; font-size: 32px; line-height: 1.2; font-weight: 500; color: var(--muted); text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  #subs b { color: var(--primary); font-weight: 800; }
  #subs b.i { color: var(--info); }
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="subs"><div class="en"></div><div class="es"></div></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const C = { bg: '#141411', surface: '#1E1D19', ink: '#F2EFE6', muted: '#ABA79B', line: '#36342D', green: '#5FB790', soft: '#1B2E26', amber: '#F5CB6B', bad: '#FFA79D', info: '#9CC4F5' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

// ---- Subtítulos: [desde, hasta, inglés, español] (los tiempos salen de las pausas del audio) ----
const SUBS = [
  [0.00, 1.80, 'The rule fits in <b>one line</b>.', 'La regla cabe en una línea.'],
  [2.29, 5.85, 'Cancel more than 24 hours ahead, and you get <b>everything back</b>.', 'Si cancelás con más de 24 horas de anticipación, te devuelven todo.'],
  [6.30, 9.05, 'Between 24 and 6 hours, you get <b>half</b>.', 'Entre 24 y 6 horas, te devuelven la mitad.'],
  [9.49, 12.30, 'Under 6 hours, the deposit stays with the venue.', 'Con menos de 6 horas, la seña queda para el local.'],
  [12.88, 14.95, 'And there\'s one exception you didn\'t expect:', 'Y hay una excepción que no esperabas:'],
  [15.36, 18.40, 'if the slot gets resold, you get your money back <b class="i">anyway</b>.', 'si el turno se revende, te devuelven igual.'],
  [18.97, 20.30, 'And here\'s the strange part.', 'Y lo raro es esto.'],
  [20.69, 22.58, 'Nobody decides that exception.', 'Esa excepción no la decide nadie.'],
  [22.96, 24.30, 'The <b>waitlist</b> does.', 'La decide la lista de espera.'],
];

// ---- Frases clave grandes (solo inglés): [desde, hasta, línea1, línea2, color de la línea 2] ----
const KEYS = [
  [0.05, 2.15, 'THE RULE', 'FITS IN ONE LINE', C.ink],
  [2.29, 5.95, '24 HOURS OR MORE', 'EVERYTHING BACK', C.green],
  [6.30, 9.20, '24 TO 6 HOURS', 'HALF BACK', C.amber],
  [9.49, 12.60, 'UNDER 6 HOURS', 'DEPOSIT KEPT', C.bad],
  [12.88, 15.30, 'ONE', 'EXCEPTION', C.info],
  [15.36, 18.60, 'IF THE SLOT IS RESOLD', 'YOU STILL GET IT BACK', C.green],
  [18.97, 20.45, 'THE STRANGE', 'PART', C.ink],
  [20.69, 22.75, 'NOBODY DECIDES', 'THAT EXCEPTION', C.ink],
  [22.96, 24.40, 'THE WAITLIST', 'DOES.', C.green],
];

// Geometría de la línea de tiempo
const AX = { y: 1010, x48: 110, x24: 410, x6: 760, x0: 970 };
const BOX = [
  { x: 260, label: '100 %', color: C.green, sub: 'full refund', at: 4.5 },
  { x: 585, label: '50 %', color: C.amber, sub: 'half back', at: 8.6 },
  { x: 865, label: '0 %', color: C.bad, sub: 'deposit kept', at: 11.0 },
];

const svg = document.getElementById('s');
const el = (tag, attrs = {}, parent = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e); return e;
};
const set = (e, attrs) => { for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); };

// Fondo con puntos muy suaves
const defs = el('defs');
const pat = el('pattern', { id: 'dots', width: 60, height: 60, patternUnits: 'userSpaceOnUse' }, defs);
el('circle', { cx: 30, cy: 30, r: 1.6, fill: '#2a2923' }, pat);
el('rect', { width: 1080, height: 1920, fill: C.bg });
el('rect', { width: 1080, height: 1920, fill: 'url(#dots)' });

// Etiqueta superior
el('text', { x: 540, y: 150, 'text-anchor': 'middle', fill: C.muted, 'font-size': 28, 'letter-spacing': 4, 'font-family': 'ui-monospace, monospace' }).textContent = 'SEÑA · REFUND RULE';

const world = el('g'); // todo lo que se atenúa al final
// Héroe: anillo (moneda)
const ring = el('circle', { cx: 540, cy: 520, r: 200, fill: 'none', stroke: C.green, 'stroke-width': 10, 'stroke-linecap': 'round' }, world);
const ringFill = el('circle', { cx: 540, cy: 520, r: 0, fill: C.soft }, world);
const coreDot = el('circle', { cx: 540, cy: 520, r: 0, fill: C.green }, world);
const qMark = el('text', { x: 540, y: 600, 'text-anchor': 'middle', fill: C.green, 'font-size': 280, 'font-weight': 800, opacity: 0 }, world); qMark.textContent = '?';

// Eje
el('line', { x1: AX.x48, y1: AX.y, x2: AX.x0, y2: AX.y, stroke: C.line, 'stroke-width': 6, 'stroke-linecap': 'round' }, world);
const segs = [
  { a: AX.x48, b: AX.x24, color: C.green }, { a: AX.x24, b: AX.x6, color: C.amber }, { a: AX.x6, b: AX.x0, color: C.bad },
].map((s) => ({ ...s, e: el('line', { x1: s.a, y1: AX.y, x2: s.a, y2: AX.y, stroke: s.color, 'stroke-width': 14, 'stroke-linecap': 'round' }, world) }));
const ticks = [['48 h', AX.x48, 0.3], ['24 h', AX.x24, 3.3], ['6 h', AX.x6, 7.8], ['start', AX.x0, 10.2]].map(([txt, x, at]) => {
  const g = el('g', {}, world);
  el('line', { x1: x, y1: AX.y - 22, x2: x, y2: AX.y + 22, stroke: C.muted, 'stroke-width': 4 }, g);
  const t = el('text', { x, y: AX.y + 72, 'text-anchor': 'middle', fill: C.muted, 'font-size': 30, 'font-family': 'ui-monospace, monospace' }, g); t.textContent = txt;
  return { g, at };
});
const dot = el('circle', { cx: AX.x48, cy: AX.y, r: 26, fill: C.soft, stroke: C.green, 'stroke-width': 8, opacity: 0 }, world);

// Cajas de porcentaje
const boxes = BOX.map((b) => {
  const g = el('g', {}, world);
  const r = el('rect', { x: -105, y: -70, width: 210, height: 140, rx: 24, fill: C.surface, stroke: b.color, 'stroke-width': 4 }, g);
  const n = el('text', { x: 0, y: 26, 'text-anchor': 'middle', fill: b.color, 'font-size': 76, 'font-weight': 800 }, g); n.textContent = b.label;
  const sub = el('text', { x: b.x, y: 880 + 90, 'text-anchor': 'middle', fill: C.muted, 'font-size': 28, 'font-family': 'ui-monospace, monospace' }, world); sub.textContent = b.sub;
  return { ...b, g, r, n, sub };
});

// Arco de reventa: de la caja 0 % a la caja 100 %
const arcD = 'M 865 740 C 800 630, 330 630, 262 740';
const exc = el('g', {}, world);
const bigLabel = el('text', { x: 540, y: 372, 'text-anchor': 'middle', fill: C.muted, 'font-size': 30, 'letter-spacing': 3, 'font-family': 'ui-monospace, monospace', opacity: 0 }, exc); bigLabel.textContent = 'IF YOU CANCEL NOW, YOU GET';
const big = el('text', { x: 540, y: 560, 'text-anchor': 'middle', fill: C.green, 'font-size': 220, 'font-weight': 800, opacity: 0 }, exc);
const arc = el('path', { d: arcD, fill: 'none', stroke: C.info, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-dasharray': '1000', 'stroke-dashoffset': '1000' }, exc);
const arrow = el('path', { d: 'M 262 740 l 6 -34 m -6 34 l -32 -16', fill: 'none', stroke: C.info, 'stroke-width': 8, 'stroke-linecap': 'round', opacity: 0 }, exc);
const arcLabel = el('text', { x: 560, y: 650, 'text-anchor': 'middle', fill: C.info, 'font-size': 32, 'font-family': 'ui-monospace, monospace', opacity: 0 }, exc); arcLabel.textContent = 'slot resold → refund';
// Pelota de "reventa": un círculo nuevo que aparece a la derecha
const resold = el('g', { opacity: 0 }, world);
el('circle', { cx: 970, cy: 1180 - 80, r: 0, fill: 'none' }, resold);

// Fila de lista de espera (solo al final)
const wl = el('g', { opacity: 0 });
const wlDots = [0, 1, 2, 3, 4, 5].map((i) => el('circle', { cx: 150 + i * 156, cy: 560, r: 44, fill: 'none', stroke: C.line, 'stroke-width': 8 }, wl));
const wlTag = el('text', { x: 540, y: 680, 'text-anchor': 'middle', fill: C.muted, 'font-size': 30, 'font-family': 'ui-monospace, monospace' }, wl); wlTag.textContent = 'waitlist · first in line decides';
const wlPulse = el('circle', { cx: 150, cy: 560, r: 44, fill: C.green, opacity: 0 }, wl);

// Frase clave
const key = el('g');
const k1 = el('text', { x: 540, y: 1195, 'text-anchor': 'middle', fill: C.ink, 'font-size': 78, 'font-weight': 800, 'letter-spacing': -1 }, key);
const k2 = el('text', { x: 540, y: 1285, 'text-anchor': 'middle', fill: C.ink, 'font-size': 78, 'font-weight': 800, 'letter-spacing': -1 }, key);

const subEn = document.querySelector('#subs .en');
const subEs = document.querySelector('#subs .es');

// Posición del punto que viaja
function dotX(t) {
  if (t < 2.3) return AX.x48;
  if (t < 3.7) return lerp(AX.x48, AX.x24, eio(P(t, 2.3, 3.7)));
  if (t < 6.3) return AX.x24;
  if (t < 8.0) return lerp(AX.x24, AX.x6, eio(P(t, 6.3, 8.0)));
  if (t < 9.5) return AX.x6;
  if (t < 10.4) return lerp(AX.x6, AX.x0, eio(P(t, 9.5, 10.4)));
  return AX.x0;
}

window.seek = (t) => {
  // --- Héroe ---
  const draw = eo(P(t, 0.1, 1.5));
  const circ = 2 * Math.PI * 200;
  const morph = eio(P(t, 1.75, 2.6)); // el anillo se vuelve el punto de la línea de tiempo
  const breathe = 1 + 0.02 * Math.sin(t * 3.2) * (1 - morph);
  set(ring, { 'stroke-dasharray': circ, 'stroke-dashoffset': circ * (1 - draw), r: lerp(200, 26, morph) * breathe, cx: lerp(540, AX.x48, morph), cy: lerp(520, AX.y, morph), 'stroke-width': lerp(10, 8, morph), opacity: 1 - (t > 2.65 ? 1 : 0) });
  set(ringFill, { r: lerp(0, 198, eo(P(t, 0.9, 1.6))) * (1 - morph) * breathe, cx: 540, cy: 520, opacity: 1 - morph });
  set(coreDot, { r: lerp(0, 28, back(P(t, 1.2, 1.6))) * (1 - morph), cx: 540, cy: 520 });
  const dx = dotX(t);
  set(dot, { cx: dx, cy: AX.y, opacity: t > 2.6 ? 1 : 0 });
  const dotColor = t < 6.3 ? C.green : t < 9.5 ? C.amber : C.bad;
  set(dot, { stroke: dotColor });

  // --- Tramos de la línea de tiempo (se pintan al pasar el punto) ---
  segs.forEach((s, i) => set(s.e, { x2: clamp(dx, s.a, s.b) }));
  segs[0].e.setAttribute('opacity', t > 2.3 ? 1 : 0);
  segs[1].e.setAttribute('opacity', t > 6.3 ? 1 : 0);
  segs[2].e.setAttribute('opacity', t > 9.5 ? 1 : 0);
  ticks.forEach((k) => set(k.g, { opacity: eo(P(t, k.at, k.at + 0.25)), transform: `translate(0 ${lerp(10, 0, eo(P(t, k.at, k.at + 0.25)))})` }));

  // --- Cajas ---
  boxes.forEach((b, i) => {
    const p = P(t, b.at, b.at + 0.45);
    const s = back(p);
    const y = 840;
    set(b.g, { transform: `translate(${b.x} ${y}) scale(${Math.max(0.001, s)})`, opacity: eo(P(t, b.at, b.at + 0.15)) });
    set(b.sub, { opacity: eo(P(t, b.at + 0.2, b.at + 0.5)) });
  });
  // La caja del 0 % se vuelve 100 % verde cuando se revende
  const flip = eio(P(t, 17.6, 18.2));
  const last = boxes[2];
  if (flip > 0) {
    last.n.textContent = flip > 0.5 ? '100 %' : '0 %';
    set(last.r, { stroke: flip > 0.5 ? C.green : C.bad });
    set(last.n, { fill: flip > 0.5 ? C.green : C.bad });
    last.sub.textContent = flip > 0.5 ? 'refunded anyway' : 'deposit kept';
    set(last.sub, { fill: flip > 0.5 ? C.green : C.muted });
  }

  // --- Excepción: arco de reventa ---
  const ap = eio(P(t, 16.55, 17.9));
  set(arc, { 'stroke-dashoffset': 1000 * (1 - ap), opacity: ap > 0 ? 1 : 0 });
  set(arrow, { opacity: ap > 0.97 ? 1 : 0 });
  set(arcLabel, { opacity: eo(P(t, 17.2, 17.8)) });
  // la caja 0 % late mientras se dice "one exception"
  if (t > 12.9 && t < 15.3) set(last.r, { 'stroke-width': 4 + 3 * (0.5 + 0.5 * Math.sin((t - 12.9) * 7)) });
  else set(last.r, { 'stroke-width': 4 });

  // --- Número grande: lo que recibe quien cancela ahora ---
  const seg = t < 6.3 ? 0 : t < 9.9 ? 1 : t < 17.7 ? 2 : 3;
  const start = [2.9, 6.3, 9.9, 17.7][seg];
  const vals = ['100 %', '50 %', '0 %', '100 %'];
  const cols = [C.green, C.amber, C.bad, C.green];
  big.textContent = vals[seg];
  const pop = back(P(t, start, start + 0.4));
  set(big, { fill: cols[seg], opacity: t < 2.9 ? 0 : 1, transform: `translate(540 ${560 - 110}) scale(${lerp(0.9, 1, pop)}) translate(-540 ${-(560 - 110)})` });
  set(bigLabel, { opacity: eo(P(t, 2.9, 3.3)), fill: seg === 3 ? C.info : C.muted });
  bigLabel.textContent = seg === 3 ? 'SLOT RESOLD → YOU GET' : 'IF YOU CANCEL NOW, YOU GET';
  set(exc, { opacity: 1 - eo(P(t, 20.0, 20.6)) });

  // --- Cierre: se atenúa el mundo, aparece la lista de espera ---
  const dim = eio(P(t, 18.97, 19.7));
  const fadeLine = 1 - 0.7 * dim;
  set(world, { opacity: fadeLine });
  qMark.setAttribute('opacity', eo(P(t, 20.75, 21.2)) * (1 - eo(P(t, 22.9, 23.1))));
  const wlIn = eo(P(t, 22.75, 23.2));
  set(wl, { opacity: wlIn });
  set(wlPulse, { opacity: eo(P(t, 23.3, 23.7)), r: 44 + 8 * Math.max(0, Math.sin((t - 23.3) * 9)) });
  wlDots.forEach((d, i) => set(d, { cy: 560 + 10 * (1 - eo(P(t, 22.75 + i * 0.04, 23.1 + i * 0.04))) }));
  // cuando entra la lista de espera, el mundo baja y se ve más débil
  if (t > 22.75) set(world, { opacity: 0.18 + 0.82 * (1 - dim) * (1 - eo(P(t, 22.75, 23.2))) + 0.0 });

  // --- Frase clave ---
  const act = KEYS.find(([a, b]) => t >= a && t <= b + 0.2);
  if (act) {
    const [a, b, l1, l2, col] = act;
    const o = eo(P(t, a, a + 0.18)) * (1 - eo(P(t, b, b + 0.2)));
    const slide = lerp(24, 0, eo(P(t, a, a + 0.25)));
    k1.textContent = l1; k2.textContent = l2;
    set(k2, { fill: col });
    set(key, { opacity: o, transform: `translate(0 ${slide})` });
  } else set(key, { opacity: 0 });

  // --- Subtítulos ---
  const cur = SUBS.find(([a, b]) => t >= a && t <= b + 0.05);
  if (cur) {
    const o = eo(P(t, cur[0], cur[0] + 0.12)) * (1 - eo(P(t, cur[1] - 0.04, cur[1] + 0.05)));
    if (subEn.innerHTML !== cur[2]) { subEn.innerHTML = cur[2]; subEs.textContent = cur[3]; }
    document.getElementById('subs').style.opacity = o;
  } else document.getElementById('subs').style.opacity = 0;
};
window.seek(0);
</script>
</body>
</html>
